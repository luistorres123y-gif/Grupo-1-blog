<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="navbar.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand-lg fixed-top site-navbar"
        data-bs-theme="dark"
        aria-label="Navegación principal"
      >
        <div class="container">
          <a class="navbar-brand" href="index.html">
            <img
              src="assets/icons/logo-rollingcode-blog.png"
              class="navbar-logo"
              alt="RollingCode Blog"
              width="175"
              height="38"
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto mb-3 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html"
                  ><i class="bi bi-house-door me-1" aria-hidden="true"></i
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="gallery.html"
                  ><i class="bi bi-images me-1" aria-hidden="true"></i
                  >Galería</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html"
                  ><i class="bi bi-people me-1" aria-hidden="true"></i>Acerca de
                  nosotros</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html"
                  ><i class="bi bi-envelope me-1" aria-hidden="true"></i
                  >Contacto</a
                >
              </li>
            </ul>
            <div class="d-flex flex-column flex-lg-row gap-2">
              <a class="btn btn-outline-light" href="login.html"
                ><i class="bi bi-person-circle me-1" aria-hidden="true"></i
                >Login</a
              >
              <button
                type="button"
                class="btn btn-accent"
                data-bs-toggle="modal"
                data-bs-target="#subscriptionModal"
              >
                <i class="bi bi-bell me-1" aria-hidden="true"></i>Suscribirse
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
