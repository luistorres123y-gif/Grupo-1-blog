<div class="modal fade" id="passwordResetModal" tabindex="-1" aria-labelledby="passwordResetModalTitle">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 overflow-hidden">
        <div class="modal-header modal-header-brand" data-bs-theme="dark">
          <h2 class="modal-title fs-5" id="passwordResetModalTitle"><i class="bi bi-key me-2" aria-hidden="true"></i>Restablecer contraseña</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form action="login.html#passwordResetSuccess" method="get" autocomplete="off">
          <div class="modal-body p-4">
            <p class="text-body-secondary">Ingresá el correo con el que te registraste y elegí una contraseña nueva.</p>
            <div class="mb-3">
              <label for="resetEmail" class="form-label">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                <input type="email" class="form-control" id="resetEmail" placeholder="nombre@correo.com" autocomplete="off" required>
              </div>
            </div>
            <div class="mb-2">
              <label for="resetNewPassword" class="form-label">Contraseña nueva</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                <input type="password" class="form-control" id="resetNewPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required aria-describedby="resetPasswordHelp">
              </div>
              <div id="resetPasswordHelp" class="form-text">Usá al menos 6 caracteres.</div>
            </div>
          </div>
          <div class="modal-footer border-0 px-4 pb-4 pt-0">
            <button type="button" class="btn btn-outline-theme" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1" aria-hidden="true"></i>Restablecer contraseña</button>
          </div>
        </form>
      </div>
    </div>
  </div>
